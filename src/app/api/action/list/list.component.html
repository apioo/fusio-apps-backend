
<h1>Action</h1>

<fusio-message [response]="response()"></fusio-message>

<fusio-search
  [searchTerm]="search()"
  (search)="doSearch(1, $event)"
  (newClick)="doNew()"
  placeholder="action"
  helpPath="api/action/">
</fusio-search>

<div class="row">
  @if (hasTaxonomy()) {
    <div class="col-xl-2">
      <app-taxonomy (select)="doSearch(1, $event ? 'taxonomy_id:' + $event : '')"></app-taxonomy>
    </div>
  }
  <div [ngClass]="{'col-xl-10': hasTaxonomy(), 'col-12': !hasTaxonomy()}">
    <table class="table table-striped">
      <thead>
      <tr>
        <th style="width:20px"><input type="checkbox" class="form-check-input" [ngModel]="selectAll()" (ngModelChange)="toggleSelectAll()"></th>
        <th style="width:50%">Name</th>
        <th style="width:50%">Class</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
        @for (entry of entries(); track entry.id) {
          <tr>
            <td>
              @if (entry.id) {
                <input type="checkbox" class="form-check-input" [ngModel]="selected()[entry.id]" (ngModelChange)="doSelect(entry);">
              }
            </td>
            <td>{{entry.name}}</td>
            <td>{{entry.class}}</td>
            <td>
              <app-list-buttons
                (onDetail)="doDetail(entry.id)"
                (onEdit)="doEdit(entry.id)"
                (onDelete)="doDelete(entry.id)"
                [buttons]="[
                  {link: ['/', 'action', 'designer', entry.id], icon: 'bi-terminal', title: 'Designer'},
                  {link: ['/', 'action', 'commit', entry.id], icon: 'bi-clock-history', title: 'Commits'},
                  {link: ['/', 'agent', 'redirect', 2, entry.id], icon: 'bi-robot', title: 'Agent'},
                ]"
              >
              </app-list-buttons>
            </td>
          </tr>
        }
      </tbody>
    </table>
    <div class="btn-group float-start me-2" role="group">
      <button (click)="doBatchTaxonomy()" [disabled]="batchDisabled()" class="btn btn-secondary"><i class="bi bi-tag"></i></button>
    </div>
    <ngb-pagination
      [page]="page()"
      [pageSize]="pageSize()"
      [collectionSize]="totalResults()"
      [maxSize]="4"
      [ellipses]="false"
      (pageChange)="doSearch($event, search())"></ngb-pagination>
  </div>
</div>
